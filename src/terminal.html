<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RXCORP Dev Console</title>
    <style>
        :root {
            --bg-base: #06090e;
            --bg-surface: #0a0e17;
            --bg-elevated: #0f1724;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #10b981;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Titlebar */
        .titlebar {
            height: 38px;
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border);
            -webkit-app-region: drag;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .traffic-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.red { background: #ef4444; }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: #10b981; }

        .terminal-heading {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 1px 7px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.28);
            border-radius: 999px;
            font-size: 9.5px;
            color: #34d399;
            font-weight: 600;
        }

        .pulse-circle {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        .title-right {
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-app-region: no-drag;
        }

        .win-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .win-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .win-btn.btn-close:hover {
            background: #ef4444;
            color: #fff;
        }

        .win-btn.active-pin {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        /* Toolbar */
        .toolbar {
            padding: 8px 12px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 9px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: #34d399;
        }

        .tools-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 4px 9px;
            color: var(--text-main);
            font-size: 11px;
            outline: none;
            width: 170px;
            transition: border-color 0.15s ease;
            user-select: text;
        }

        .search-input:focus {
            border-color: rgba(16, 185, 129, 0.5);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 4px 9px;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .toggle-scroll-label {
            font-size: 11px;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .toggle-scroll-label input {
            cursor: pointer;
            accent-color: var(--accent-primary);
        }

        /* Terminal Body */
        .terminal-container {
            flex: 1;
            background: #04060a;
            overflow-y: auto;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.55;
            user-select: text;
        }

        .terminal-container::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .terminal-line {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 1.5px 0;
            word-break: break-all;
            border-bottom: 1px solid rgba(255, 255, 255, 0.015);
        }

        .terminal-line:hover {
            background: rgba(255, 255, 255, 0.025);
        }

        .log-time {
            color: #475569;
            font-size: 10.5px;
            flex-shrink: 0;
            user-select: none;
        }

        .log-tag {
            font-size: 9.5px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            flex-shrink: 0;
            letter-spacing: 0.4px;
            user-select: none;
        }

        /* Tag colors */
        .tag-ui, .tag-clic { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .tag-pelican, .tag-scan, .tag-link { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .tag-minecraft, .tag-game { background: rgba(192, 132, 252, 0.15); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }
        .tag-auth, .tag-ms { background: rgba(250, 204, 21, 0.15); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
        .tag-download, .tag-net { background: rgba(96, 165, 250, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }
        .tag-verify { background: rgba(45, 212, 191, 0.15); color: #2dd4bf; border: 1px solid rgba(45, 212, 191, 0.3); }
        .tag-error { background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.4); }
        .tag-warn, .tag-clean { background: rgba(251, 191, 36, 0.18); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.35); }
        .tag-info, .tag-init { background: rgba(148, 163, 184, 0.12); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.25); }
        .tag-success { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.35); }
        .tag-console { background: rgba(168, 85, 247, 0.12); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.25); }

        .log-msg {
            color: #cbd5e1;
            flex: 1;
        }

        .log-msg.error-msg {
            color: #fda4af;
            font-weight: 600;
        }

        /* Status Footer */
        .status-footer {
            height: 26px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .footer-left {
            display: flex;
            gap: 12px;
        }

        .count-pill {
            font-weight: 600;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <!-- Titlebar -->
    <header class="titlebar">
        <div class="title-left">
            <div class="traffic-dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="terminal-heading">
                <span>RXLauncher Dev Console // Live Engine Logs</span>
                <span class="live-badge">
                    <span class="pulse-circle"></span>
                    LIVE STREAM
                </span>
            </div>
        </div>
        <div class="title-right">
            <button id="btn-pin" class="win-btn" title="Garder au premier plan">📌</button>
            <button id="btn-min" class="win-btn" title="Réduire">─</button>
            <button id="btn-max" class="win-btn" title="Agrandir">□</button>
            <button id="btn-close" class="win-btn btn-close" title="Fermer">✕</button>
        </div>
    </header>

    <!-- Filter & Action Toolbar -->
    <div class="toolbar">
        <div class="filter-tabs" id="filter-tabs">
            <button class="filter-btn active" data-filter="ALL">TOUT</button>
            <button class="filter-btn" data-filter="UI">CLIC / UI</button>
            <button class="filter-btn" data-filter="PELICAN">PELICAN</button>
            <button class="filter-btn" data-filter="MINECRAFT">MINECRAFT</button>
            <button class="filter-btn" data-filter="AUTH">AUTH</button>
            <button class="filter-btn" data-filter="CONSOLE">CONSOLE</button>
            <button class="filter-btn" data-filter="ERROR">ERREURS</button>
        </div>

        <div class="tools-actions">
            <input type="text" id="input-search-log" class="search-input" placeholder="Filtrer par mot-clé...">
            <label class="toggle-scroll-label">
                <input type="checkbox" id="check-autoscroll" checked>
                Auto-scroll
            </label>
            <button id="btn-copy-all" class="action-btn" title="Copier tous les logs">Copier</button>
            <button id="btn-export-log" class="action-btn" title="Enregistrer dans un fichier .log">Exporter</button>
            <button id="btn-clear-all" class="action-btn" title="Effacer l'affichage">Effacer</button>
        </div>
    </div>

    <!-- Terminal Container -->
    <div id="terminal-container" class="terminal-container"></div>

    <!-- Status Footer -->
    <footer class="status-footer">
        <div class="footer-left">
            <span>Total : <strong id="stat-total" class="count-pill">0</strong></span>
            <span>Affichés : <strong id="stat-visible" class="count-pill">0</strong></span>
            <span>Erreurs : <strong id="stat-errors" class="count-pill" style="color: #f43f5e;">0</strong></span>
        </div>
        <div>
            <span>RXLauncher // Terminal de Débogage Temps Réel</span>
        </div>
    </footer>

    <script>
        const { ipcRenderer, clipboard } = require('electron');
        const fs = require('fs');
        const path = require('path');

        const container = document.getElementById('terminal-container');
        const inputSearch = document.getElementById('input-search-log');
        const checkAutoScroll = document.getElementById('check-autoscroll');
        const statTotal = document.getElementById('stat-total');
        const statVisible = document.getElementById('stat-visible');
        const statErrors = document.getElementById('stat-errors');

        let allLogs = [];
        let currentFilter = 'ALL';
        let searchQuery = '';
        let isPinned = false;
        let errorCount = 0;

        // Window Controls
        document.getElementById('btn-min').addEventListener('click', () => ipcRenderer.send('dev-terminal-minimize'));
        document.getElementById('btn-max').addEventListener('click', () => ipcRenderer.send('dev-terminal-maximize'));
        document.getElementById('btn-close').addEventListener('click', () => ipcRenderer.send('dev-terminal-close'));
        
        const pinBtn = document.getElementById('btn-pin');
        pinBtn.addEventListener('click', () => {
            isPinned = !isPinned;
            pinBtn.classList.toggle('active-pin', isPinned);
            ipcRenderer.send('dev-terminal-set-always-on-top', isPinned);
        });

        // Filter Tabs
        document.querySelectorAll('#filter-tabs .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#filter-tabs .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderLogs();
            });
        });

        // Search Filter
        inputSearch.addEventListener('input', () => {
            searchQuery = inputSearch.value.trim().toLowerCase();
            renderLogs();
        });

        // Action Buttons
        document.getElementById('btn-copy-all').addEventListener('click', () => {
            if (allLogs.length === 0) return;
            const text = allLogs.map(l => `${l.time} [${l.category}] ${l.message}`).join('\n');
            clipboard.writeText(text);
        });

        document.getElementById('btn-clear-all').addEventListener('click', () => {
            allLogs = [];
            errorCount = 0;
            container.innerHTML = '';
            updateStats(0, 0);
            ipcRenderer.send('dev-terminal-clear');
        });

        document.getElementById('btn-export-log').addEventListener('click', () => {
            if (allLogs.length === 0) return;
            const text = allLogs.map(l => `${l.time} [${l.category}] ${l.message}`).join('\n');
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `rxcorp-dev-logs-${Date.now()}.log`;
            a.click();
        });

        function getTagClass(category) {
            const cat = (category || 'INFO').toLowerCase();
            if (cat.includes('ui') || cat.includes('clic')) return 'tag-ui';
            if (cat.includes('pelican') || cat.includes('scan') || cat.includes('link')) return 'tag-pelican';
            if (cat.includes('minecraft') || cat.includes('game')) return 'tag-minecraft';
            if (cat.includes('auth') || cat.includes('ms')) return 'tag-auth';
            if (cat.includes('download') || cat.includes('net')) return 'tag-download';
            if (cat.includes('verify')) return 'tag-verify';
            if (cat.includes('error') || cat.includes('err') || cat.includes('fatal')) return 'tag-error';
            if (cat.includes('warn') || cat.includes('clean')) return 'tag-warn';
            if (cat.includes('success')) return 'tag-success';
            if (cat.includes('console')) return 'tag-console';
            return 'tag-info';
        }

        function createLineElement(entry) {
            const line = document.createElement('div');
            line.className = 'terminal-line';

            const tagClass = getTagClass(entry.category);
            const isError = tagClass === 'tag-error';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = entry.time || '[00:00:00]';

            const tagSpan = document.createElement('span');
            tagSpan.className = `log-tag ${tagClass}`;
            tagSpan.textContent = `[${entry.category}]`;

            const msgSpan = document.createElement('span');
            msgSpan.className = `log-msg ${isError ? 'error-msg' : ''}`;
            msgSpan.textContent = entry.message || '';

            line.appendChild(timeSpan);
            line.appendChild(tagSpan);
            line.appendChild(msgSpan);

            return line;
        }

        function isEntryMatching(entry) {
            if (currentFilter !== 'ALL') {
                const cat = (entry.category || '').toUpperCase();
                if (currentFilter === 'UI' && !cat.includes('UI') && !cat.includes('CLIC')) return false;
                if (currentFilter === 'PELICAN' && !cat.includes('PELICAN') && !cat.includes('SCAN') && !cat.includes('LINK') && !cat.includes('VERIFY')) return false;
                if (currentFilter === 'MINECRAFT' && !cat.includes('MINECRAFT') && !cat.includes('GAME')) return false;
                if (currentFilter === 'AUTH' && !cat.includes('AUTH') && !cat.includes('MS')) return false;
                if (currentFilter === 'CONSOLE' && !cat.includes('CONSOLE')) return false;
                if (currentFilter === 'ERROR' && !cat.includes('ERROR') && !cat.includes('WARN')) return false;
            }

            if (searchQuery) {
                const text = `${entry.time} ${entry.category} ${entry.message}`.toLowerCase();
                if (!text.includes(searchQuery)) return false;
            }

            return true;
        }

        function renderLogs() {
            container.innerHTML = '';
            let visibleCount = 0;

            const fragment = document.createDocumentFragment();
            for (const entry of allLogs) {
                if (isEntryMatching(entry)) {
                    fragment.appendChild(createLineElement(entry));
                    visibleCount++;
                }
            }

            container.appendChild(fragment);
            updateStats(allLogs.length, visibleCount);

            if (checkAutoScroll.checked) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function updateStats(total, visible) {
            statTotal.textContent = total;
            statVisible.textContent = visible;
            statErrors.textContent = errorCount;
        }

        function appendLogEntry(entry) {
            allLogs.push(entry);
            if (allLogs.length > 5000) allLogs.shift();

            const cat = (entry.category || '').toUpperCase();
            if (cat.includes('ERROR') || cat.includes('FATAL')) {
                errorCount++;
            }

            if (isEntryMatching(entry)) {
                container.appendChild(createLineElement(entry));
                if (checkAutoScroll.checked) {
                    container.scrollTop = container.scrollHeight;
                }
            }

            updateStats(allLogs.length, container.children.length);
        }

        // Listen for new incoming log entries from main process
        ipcRenderer.on('terminal-log-entry', (event, entry) => {
            appendLogEntry(entry);
        });

        ipcRenderer.on('terminal-clear-entries', () => {
            allLogs = [];
            errorCount = 0;
            container.innerHTML = '';
            updateStats(0, 0);
        });

        // Load historical logs on startup
        ipcRenderer.invoke('dev-terminal-get-history').then(history => {
            if (Array.isArray(history) && history.length > 0) {
                allLogs = history;
                errorCount = allLogs.filter(l => (l.category || '').toUpperCase().includes('ERROR')).length;
                renderLogs();
            }
        }).catch(() => {});
    </script>
</body>
</html>

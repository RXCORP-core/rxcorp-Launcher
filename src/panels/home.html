<div class="container">
    <div class="status-server">
        <img class="server-status-icon" src="assets/images/icon/icon.png">
        <div class="server-status-infos">
            <div class="server-status-badge">ZONE INFECTÉE // SECTEUR-04</div>
            <div class="server-status-name">DELTAZONE</div>
            <div class="server-status-text">CONNEXION ÉTABLIE - 0 ms</div>
        </div>
        <div class="status-player-count">
            <div class="player-count-label">SURVIVANTS</div>
            <div class="player-count">0</div>
        </div>
    </div>

    <div class="home-bottom">
        <div class="new-tab">
            <div class="titre-tab-new">
                <span class="hazard-tag">☣</span> TRANSMISSIONS RADIO <span class="hazard-tag">☣</span>
            </div>
            <div class="news-list content-scroll"></div>
        </div>
        <div class="social-tab">
            <div class="social-list content-scroll">
                <div data-url="https://discord.gg/deltazone" class="social-block" title="Discord">
                    <div class="icon-discord icon-social"></div>
                </div>

                <div data-url="https://github.com/CHATDOO/rx-Launcher" class="social-block" title="GitHub">
                    <div class="icon-github icon-social"></div>
                </div>

                <div data-url="https://youtube.com" class="social-block" title="YouTube">
                    <div class="icon-youtube icon-social"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="player-options">
            <div class="player-head"></div>
        </div>

        <div class="play-elements">
            <div class="play-instance">
                <button class="play-btn">SURVIVRE</button>
                <div class="instance-select icon-arrow"></div>
            </div>
            <div class="info-starting-game">
                <div class="info-starting-game-text">CHARGEMENT...</div>
                <progress value="0" max="0" class="progress-bar"></progress>
            </div>
        </div>

        <div class="settings-btn icon-settings" title="Configuration"></div>
    </div>

    <div class="instance-popup">
        <div class="instances-tab">
            <div class="close-popup icon-close"></div>
            <p>SÉLECTION DE MISSION</p>
            <div class="instances-List"></div>
        </div>
    </div>
</div>
